services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fintrack-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      REDIS_URL: redis://redis:6379
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN}
      EODHD_BASE_URL: ${EODHD_BASE_URL:-https://eodhd.com/api}
      FINNHUB_REQUESTS_PER_MINUTE: ${FINNHUB_REQUESTS_PER_MINUTE:-50}
      COINGECKO_REQUESTS_PER_MINUTE: ${COINGECKO_REQUESTS_PER_MINUTE:-20}
      EODHD_REQUESTS_PER_DAY: ${EODHD_REQUESTS_PER_DAY:-20}
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    container_name: fintrack-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:3001
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api
